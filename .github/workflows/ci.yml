name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Contract is current
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code backend/contracts/openapi.json
      - name: Frontend
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
