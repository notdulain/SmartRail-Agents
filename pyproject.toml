[project]
name = "smartrail"
version = "0.1.0"
description = "Configurable local chat platform for AI agents, backed by OpenCode"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.20.0",
    "aiosqlite==0.22.1",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "platformdirs==4.12.3",
    "pydantic==2.13.5",
    "sse-starlette==3.5.0",
    "uvicorn==0.54.0",
]

[project.scripts]
smartrail = "backend.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
